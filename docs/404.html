<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, width=device-width"
    />
    <meta name="theme-color" content="#242424" />
    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("kanjii:theme") || "dark";
          var light =
            p === "light" ||
            (p === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
          // Also set the chrome colour now. applyTheme() keeps this in sync
          // afterwards by reading --bg, but it can't run until the stylesheet
          // and modules have loaded, and a light-mode user would see dark
          // chrome until then. These two must match --bg in index.css.
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", light ? "#f6f7f9" : "#242424");
        } catch (e) {}
      })();
    </script>
    <!-- Google Search picks the site icon from the home page, and wants a square
         whose sides are a multiple of 48px; it also fetches /favicon.ico by
         convention. Before this there was only favicon.svg (64px, and its glyph
         is a <text> element that needs a Japanese system font — a server-side
         rasteriser without one renders nothing), plus a 180px apple-touch-icon.
         Neither qualified, so search results showed the generic globe.
         The .ico carries 16/32/48. Keep the SVG first: browsers that support it
         prefer it, and it stays sharp at any size. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kanjii" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Sawarabi Mincho used to be pulled from fonts.googleapis.com. It is now
         self-hosted and subset in public/fonts/, declared by @font-face in
         index.css: a third-party stylesheet is the one asset the service worker
         can't dependably keep, so offline — the whole point of the PWA — silently
         lost the display face. It also removes a request to Google on every
         load. Don't reintroduce the link. -->
    <title>Kanjii.org: Japanese Kanji Tracker</title>

    <!-- Search results and link previews. Absolute URLs are required: crawlers
         resolve og:image against nothing, so a relative path silently yields no
         preview image. Keep the three descriptions identical — they are the same
         sentence in three formats, and letting them drift is how one of them ends
         up stale. -->
    <link rel="canonical" href="https://kanjii.org/" />
    <meta name="description" content="Free, open-source Japanese kanji and vocabulary tracker. No fixed curriculum: tag the kanji you know, build your own word list, and practise writing by hand." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kanjii" />
    <meta property="og:url" content="https://kanjii.org/" />
    <meta property="og:title" content="Kanjii.org: Japanese Kanji Tracker" />
    <meta property="og:description" content="Free, open-source Japanese kanji and vocabulary tracker. No fixed curriculum: tag the kanji you know, build your own word list, and practise writing by hand." />
    <!-- Square, so summary rather than summary_large_image: the only artwork
         that exists is the 512px PWA icon, and claiming a wide card would render
         it letterboxed. Swap both if a 1200x630 banner is ever made. -->
    <meta property="og:image" content="https://kanjii.org/pwa-512x512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kanjii.org: Japanese Kanji Tracker" />
    <meta name="twitter:description" content="Free, open-source Japanese kanji and vocabulary tracker. No fixed curriculum: tag the kanji you know, build your own word list, and practise writing by hand." />
    <meta name="twitter:image" content="https://kanjii.org/pwa-512x512.png" />


    <!-- Tells Google and the AI crawlers what this is in machine-readable form.
         The description must stay in step with the meta description above. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Kanjii",
        "url": "https://kanjii.org/",
        "applicationCategory": "EducationalApplication",
        "applicationSubCategory": "Japanese kanji and vocabulary tracker",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript.",
        "description": "Kanjii is a free, open-source Japanese kanji and vocabulary tracker for learners who want to choose what they study instead of following a fixed curriculum. Track the kanji you know, practise writing, build your own vocabulary, and review everything with spaced repetition.",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "inLanguage": "en",
        "teaches": "Japanese kanji and vocabulary",
        "featureList": [
          "Track kanji as new, learning or known",
          "Kanji handwriting practice with per-stroke checking",
          "Personal vocabulary list built from words you meet",
          "Spaced repetition in both directions",
          "Extract vocabulary from pasted Japanese text",
          "Anki deck import",
          "Printable genko-yoshi worksheets",
          "Works offline, no account required"
        ],
        "author": {
          "@type": "Person",
          "name": "Šimon"
        },
        "sameAs": ["https://github.com/sb-17/kanjii"]
      }
    </script>

    <script>
      window.goatcounter = {
        no_onload: true
      };
    </script>

    <script
      data-goatcounter="https://kanjii.goatcounter.com/count"
      async src="//gc.zgo.at/count.js">
    </script>
    <script type="module" crossorigin src="/assets/index-CihxktrX.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CyBop546.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <!-- In <noscript>, not inside #root. Rendering it in #root put the text on
         screen for the moment boot() spends reading IndexedDB, which read as the
         page flashing before the app appeared. Here it never renders for anyone
         with JavaScript, but it is still in the HTML the AI crawlers read, since
         they don't execute JS. Don't move it back into #root.

         Keep it in step with /features/ and the meta description above. -->
    <noscript>
      <div class="page page-center">
        <h1 class="page-title">Kanjii — a Japanese kanji and vocabulary tracker</h1>
        <p>
          Learn what you want. Kanjii keeps track of the rest — tag the kanji you
          know, build your own word list, and practise writing by hand. No fixed
          curriculum, no account, free and open source.
        </p>
        <p>
          <a href="/features/">Features</a> · <a href="/faq/">FAQ</a> ·
          <a href="/privacy/">Privacy</a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
